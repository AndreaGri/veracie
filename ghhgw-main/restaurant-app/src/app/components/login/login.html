<div class="auth-container">
  <div *ngIf="!showTableInput">
    <h2>{{ isLogin ? 'Accedi' : 'Registrati' }}</h2>
    <input type="email" [(ngModel)]="email" placeholder="Email">
    <input type="password" [(ngModel)]="password" placeholder="Password">
    <button (click)="submit()">{{ isLogin ? 'Entra' : 'Crea Account' }}</button>
    <p (click)="isLogin = !isLogin">{{ isLogin ? 'Nuovo utente? Registrati' : 'Hai un account? Accedi' }}</p>
  </div>

  <div *ngIf="showTableInput">
    <h2>Benvenuto! 👋</h2>
    <p style="margin-bottom: 20px; color: #666;">A quale tavolo sei seduto?</p>
    <input type="text" [(ngModel)]="tableNumber" placeholder="Es: Tavolo 5" autofocus>
    <button (click)="goToMenu()">Vai al Menu</button>
  </div>
</div>
